[project]
name = "openapi2jsonschema"
version = "0.9.0"
description = "A utility to extract JSON Schema from a valid OpenAPI specification"
authors = [
    {name = "Gareth Rushgrove", email = "gareth@morethanseven.net"},
    {name = "Olivier Dupouy", email = "odupouy@forsk.com"},
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["openapi", "jsonschema"]
dependencies = [
    "jsonref>=0.2.0",
    "pyyaml>=6",
    "click>=7.0",
    "colorama>=0.4.1",
]

[project.urls]
repository = "https://github.com/garethr/openapi2jsonschema"

[project.scripts]
openapi2jsonschema = "openapi2jsonschema.command:default"

[project.optional-dependencies]
dev = [
    "pytest>=3.4",
    "pytest-black>=0.3.2",
    "pytest-mypy>=0.3.2",
    "pytest-cov>=2.6",
    "pytest-datafiles>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
